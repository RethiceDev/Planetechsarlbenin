name: Deploy React Frontend

on:
  push:
    branches: [ main ] # Déclenche le déploiement lors d'un push sur la branche main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code depuis votre dépôt GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installe l'environnement Node.js (Version 22)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Installe les dépendances et compile le projet React avec les bonnes variables d'environnement
      - name: Install dependencies and build
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: https://admin.planetechsarlbenin.com
          VITE_BACKEND_URL: https://admin.planetechsarlbenin.com

      # 4. Transfère le dossier "dist" directement sur votre VPS
      - name: Deploy to VPS via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/"
          target: "/var/www/planetechsarlbenin.com/html"
          strip_components: 1